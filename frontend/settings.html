<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- Header / Controls -->
<header class="top-bar">
        <div class="controls">
            <!-- Replaces room select with a back button for the settings page -->
            <a href="bookings.html" class="back-link">&lsaquo; Back to Calendar</a>

            <div class="menu-container">
                <button id="menu-toggle">Menu</button>
                <div id="menu-dropdown" class="hidden dropdown">
                    <a href="bookings.html">Bookings Calendar</a>
                    <a href="#" id="my-bookings-link">My Bookings</a>
                    <a href="settings.html" class="active">Settings</a>
                    <a href="#" id="Logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Settings Container -->
    <main class="calendar-container">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Account Settings</h2>
            </div>

            <form id="settings-form">

                <!-- Profile Section -->
                <section class="settings-section">
                    <h3>Profile Information</h3>
                    <div class="form-group">
                        <label for="apartment">Apartment Number </label>
                        <!-- Disabled so users can't change their login identifier -->
                        <input type="text" id="apartment" class="form-control" value="" disabled>
                    </div>
                   
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="johan12@example.com">
                    </div>
                </section>

                <!-- Password Section -->
                <section class="settings-section">
                    <h3>Change Password</h3>
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" class="form-control">
                    </div>
                </section>

                <!-- Notifications Section -->
                <section class="settings-section">
                    <h3>Notifications</h3>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="notif-email" checked>
                        <label for="notif-email">Send email reminders 1 hour before my laundry time</label>
                    </div>
                </section>

                <!-- Actions -->
                <div class="settings-actions">
                    <!-- Reusing existing button classes -->
                    <button type="button" class="btn-cancel" onclick="window.location.href='bookings.html'">Cancel</button>
                    <button type="submit" class="btn-confirm">Save Changes</button>
                </div>
            </form>
        </div>
    </main>







    
 <script src="bookings.js"></script>

</body>
</html>
