<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- Added the login-wrapper class here to center the form on this page only -->
<body class="login-wrapper">
    <div id="app-container">
        <!-- Login screen -->
        <section id="login-section">
            <h2>Log in</h2>
            <form id="login-form">
                <input type="text" id="apartment" placeholder="Apartment Number" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log in</button>
            </form>
            <p id="login-message" style="color: red;"></p>
        </section>

        <!--Application (hidden until logged in)-->
        <section id="main-section" style="display: none;">
            <h2>Laundry Bookings</h2>
            <button id="logout-btn">Log out</button>

            <div id="controls">
                <!--filter and search section...-->
            </div>

            <div id="bookings-list">
                <!--Booking section (loads with JS)-->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
