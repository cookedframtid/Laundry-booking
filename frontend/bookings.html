<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Bookings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="available-bookings"> Available Bookings</h1>

<section id="bookingssection">

    <h1>Available Bookings</h1>

    <div id="calendar-header">
        <button id="prev-month">◀</button>
        <h2 id="month-title"></h2>
        <button id="next-month">▶</button>
    </div>

    
   <div id="calendar-grid">
    <table>
        <thead>
            <tr id="header-row"></tr>
        </thead>
        <tbody id="schedule-body"></tbody>
    </table>
    </div>
        
 </section>


    <div id="day-details"></div>

    <div id="menu-container">
    <button id="menu-toggle">⋮</button>
    <div id="menu-dropdown" class="hidden">
        <button id="cancel-booking">Cancel Booking</button>
        <button id="change-booking">Edit Booking</button>
        <button id="my-bookings">My Bookings</button>
    </div>
    <div id="confirm-overlay" class="hidden">
    <div id="confirm-box">
        <p id="confirm-text"></p>
        <button id="confirm-yes">Confirm Booking</button>
        <button id="confirm-no">Cancel</button>
    </div>
    

</div>

    <script src="bookings.js"></script>
</body>
</html>
